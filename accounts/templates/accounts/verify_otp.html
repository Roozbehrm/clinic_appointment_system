{% extends "base.html" %}
{% block title %}تایید کد{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="card p-4 text-center">
      <i class="bi bi-shield-lock display-5 text-primary mb-2"></i>
      <h4 class="mb-2">تایید کد یکبار مصرف</h4>
      <p class="text-muted">کد ۶ رقمی ارسال‌شده را وارد کنید.</p>
      <form method="post">
        {% csrf_token %}
        {{ form.code }}
        {% for e in form.code.errors %}<div class="text-danger small mt-1">{{ e }}</div>{% endfor %}
        <button class="btn btn-primary w-100 mt-3" type="submit">تایید</button>
      </form>
      <form method="get" action="{% url 'accounts:resend_otp' %}" class="mt-2">
        <input type="hidden" name="via" value="sms">
        <button class="btn btn-link" type="submit">ارسال مجدد کد (پیامک)</button>
      </form>
      <form method="get" action="{% url 'accounts:resend_otp' %}" class="mt-1">
        <input type="hidden" name="via" value="email">
        <button class="btn btn-link btn-sm" type="submit">کد را نگرفتید؟ از طریق ایمیل ارسال شود</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
